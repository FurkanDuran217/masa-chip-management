  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gold)" stroke-width="12" stroke-dasharray="24 16" opacity="0.6"/>
  <circle cx="256" cy="256" r="150" fill="#0d141c" stroke="url(#gold)" stroke-width="6"/>

