      <stop offset="0%" stop-color="#1b2a3a"/>
      <stop offset="100%" stop-color="#070b10"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="100%" stop-color="#f59e0b"/>
