  <path d="M256 140 C280 190 340 220 340 270 C340 305 310 330 275 330 C258 330 256 315 256 315 C256 315 254 330 237 330 C202 330 172 305 172 270 C172 220 232 190 256 140 Z" fill="url(#gold)" filter="url(#glow)"/>
